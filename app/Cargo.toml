[package]
name = "smartcam"
version = "1.0.0"
edition = "2021"
authors = ["Rubens Rainelli <rubens@rainelli.it>"]
description = "SmartCam — Applicazione Desktop Nativa & Virtual Camera Windows 11 (PEFL v1.0)"
license = "LicenseRef-PEFL-1.0"
license-file = "../LICENSE"
publish = false

[[bin]]
name = "SmartCam"
path = "src/main.rs"

[dependencies]
# Zero external dependencies — pure native Win32 API & Media Foundation COM bindings

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
