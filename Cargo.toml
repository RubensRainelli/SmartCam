[workspace]
resolver = "2"
members = [
    "app",
    "crates/smartcam-engine",
    "crates/smartcam-capture",
    "crates/smartcam-mf-source",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["Rubens Rainelli <rubens@rainelli.it>"]
license = "LicenseRef-PEFL-1.0"
license-file = "LICENSE"
repository = "https://github.com/RubensRainelli/SmartCam"

[workspace.dependencies]
smartcam-engine = { path = "crates/smartcam-engine" }
smartcam-capture = { path = "crates/smartcam-capture" }
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Globalization",
] }
windows-core = "0.58"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.1"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
